name: Pack check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pack-check:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'VERSION/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:pkg

      - name: Dry run pack
        run: npm pack --dry-run
